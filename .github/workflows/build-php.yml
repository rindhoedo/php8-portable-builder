name: Build PHP 8 Portable for RHEL 7/8/9

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP Version'
        required: true
        default: '8.3.14'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: centos:7  # Use CentOS 7 for maximum compatibility
    
    steps:
      - name: Install Build Dependencies
        run: |
          # Enable EPEL and SCL
          yum install -y epel-release centos-release-scl
          
          # Install newer GCC from SCL (required for PHP 8)
          yum install -y devtoolset-11-gcc devtoolset-11-gcc-c++ devtoolset-11-make
          
          # Install base dependencies
          yum install -y autoconf automake libtool \
            libxml2-devel openssl-devel sqlite-devel \
            libcurl-devel libpng-devel libjpeg-devel \
            freetype-devel postgresql-devel readline-devel \
            wget tar gzip bzip2 pkgconfig cmake3 \
            bison re2c
          
          # Create cmake symlink
          ln -sf /usr/bin/cmake3 /usr/bin/cmake || true
      
      - name: Enable DevToolset
        run: |
          echo "source /opt/rh/devtoolset-11/enable" >> ~/.bashrc
          source /opt/rh/devtoolset-11/enable
          gcc --version
      
      - name: Build Oniguruma from Source
        run: |
          source /opt/rh/devtoolset-11/enable
          cd /tmp
          wget -q https://github.com/kkos/oniguruma/releases/download/v6.9.9/onig-6.9.9.tar.gz
          tar -xzf onig-6.9.9.tar.gz
          cd onig-6.9.9
          ./configure --prefix=/usr/local --disable-shared --enable-static
          make -j$(nproc)
          make install
      
      - name: Build Libzip from Source
        run: |
          source /opt/rh/devtoolset-11/enable
          cd /tmp
          
          # Build zlib first (static)
          wget -q https://zlib.net/zlib-1.3.tar.gz
          tar -xzf zlib-1.3.tar.gz
          cd zlib-1.3
          ./configure --prefix=/usr/local --static
          make -j$(nproc)
          make install
          
          # Build libzip
          cd /tmp
          wget -q https://libzip.org/download/libzip-1.10.1.tar.gz
          tar -xzf libzip-1.10.1.tar.gz
          cd libzip-1.10.1
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          make -j$(nproc)
          make install
      
      - name: Build libpq (PostgreSQL) Static
        run: |
          source /opt/rh/devtoolset-11/enable
          cd /tmp
          wget -q https://ftp.postgresql.org/pub/source/v15.5/postgresql-15.5.tar.gz
          tar -xzf postgresql-15.5.tar.gz
          cd postgresql-15.5
          ./configure --prefix=/usr/local --without-readline --without-zlib
          cd src/interfaces/libpq
          make -j$(nproc)
          make install
          cd /tmp/postgresql-15.5/src/include
          make install
      
      - name: Download PHP Source
        run: |
          cd /tmp
          wget https://www.php.net/distributions/php-${{ inputs.php_version }}.tar.gz
          tar -xzf php-${{ inputs.php_version }}.tar.gz
      
      - name: Configure PHP
        run: |
          source /opt/rh/devtoolset-11/enable
          
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig:$PKG_CONFIG_PATH
          export CFLAGS="-I/usr/local/include -fPIC"
          export CPPFLAGS="-I/usr/local/include"
          export LDFLAGS="-L/usr/local/lib -L/usr/local/lib64 -static-libgcc"
          
          cd /tmp/php-${{ inputs.php_version }}
          
          ./configure \
            --prefix=/opt/php8 \
            --enable-mbstring \
            --enable-bcmath \
            --enable-sockets \
            --enable-exif \
            --enable-gd \
            --with-jpeg \
            --with-freetype \
            --with-curl \
            --with-openssl \
            --with-zlib \
            --with-zip \
            --with-pgsql=/usr/local \
            --with-pdo-pgsql=/usr/local \
            --with-pdo-mysql \
            --with-mysqli \
            --enable-pcntl \
            --enable-fpm=no \
            --disable-cgi \
            --with-pic
      
      - name: Compile PHP
        run: |
          source /opt/rh/devtoolset-11/enable
          cd /tmp/php-${{ inputs.php_version }}
          make -j$(nproc)
      
      - name: Install PHP
        run: |
          source /opt/rh/devtoolset-11/enable
          cd /tmp/php-${{ inputs.php_version }}
          make install
          
          # Copy necessary shared libraries
          mkdir -p /opt/php8/lib
          
          # Copy only essential shared libs that are safe across RHEL versions
          cp -a /usr/local/lib/libonig.a /opt/php8/lib/ 2>/dev/null || true
          cp -a /usr/local/lib/libzip.a /opt/php8/lib/ 2>/dev/null || true
          
          # Check dependencies
          echo "=== PHP Binary Dependencies ==="
          ldd /opt/php8/bin/php
      
      - name: Configure php.ini
        run: |
          cd /tmp/php-${{ inputs.php_version }}
          cp php.ini-production /opt/php8/bin/php.ini
          
          cat >> /opt/php8/bin/php.ini << 'EOF'
          
          ; Custom configuration
          memory_limit = 256M
          upload_max_filesize = 50M
          post_max_size = 50M
          max_execution_time = 300
          max_input_time = 300
          
          display_errors = Off
          error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
          log_errors = On
          
          date.timezone = Asia/Jakarta
          EOF
      
      - name: Create Wrapper Script
        run: |
          cat > /opt/php8/run-php.sh << 'EOF'
          #!/bin/bash
          export PHP_HOME="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$PHP_HOME/lib:$LD_LIBRARY_PATH"
          export PATH="$PHP_HOME/bin:$PATH"
          export PHPRC="$PHP_HOME/bin"
          
          exec "$PHP_HOME/bin/php" "$@"
          EOF
          
          chmod +x /opt/php8/run-php.sh
      
      - name: Test PHP
        run: |
          /opt/php8/bin/php -v
          echo ""
          echo "=== Installed Extensions ==="
          /opt/php8/bin/php -m
          echo ""
          echo "=== Test JSON ==="
          /opt/php8/bin/php -r "echo json_encode(['status' => 'OK', 'test' => 'success']) . PHP_EOL;"
          echo ""
          echo "=== Test Base64 ==="
          /opt/php8/bin/php -r "echo base64_encode('Hello World') . PHP_EOL;"
          echo ""
          echo "=== Check Extensions ==="
          /opt/php8/bin/php -r "
          \$exts = ['mysqli', 'pgsql', 'pdo_mysql', 'pdo_pgsql', 'gd', 'curl', 'json', 'zip', 'mbstring'];
          foreach (\$exts as \$ext) {
              echo \$ext . ': ' . (extension_loaded(\$ext) ? '✓' : '✗') . PHP_EOL;
          }
          "
      
      - name: Create Compatibility Test Script
        run: |
          cat > /opt/php8/test-compatibility.php << 'EOF'
          <?php
          echo "PHP Compatibility Test\n";
          echo str_repeat("=", 50) . "\n\n";
          
          echo "PHP Version: " . phpversion() . "\n";
          echo "OS: " . php_uname('s') . " " . php_uname('r') . "\n\n";
          
          echo "Required Extensions:\n";
          $required = ['json', 'mbstring', 'curl', 'gd', 'mysqli', 'pdo_mysql', 'pgsql', 'pdo_pgsql', 'zip'];
          foreach ($required as $ext) {
              $status = extension_loaded($ext) ? '✓ Loaded' : '✗ Missing';
              printf("  %-15s: %s\n", $ext, $status);
          }
          
          echo "\nBuilt-in Functions:\n";
          echo "  base64_encode: " . (function_exists('base64_encode') ? '✓' : '✗') . "\n";
          echo "  json_encode: " . (function_exists('json_encode') ? '✓' : '✗') . "\n";
          echo "  curl_init: " . (function_exists('curl_init') ? '✓' : '✗') . "\n";
          
          echo "\nSystem Info:\n";
          echo "  Max execution time: " . ini_get('max_execution_time') . "s\n";
          echo "  Memory limit: " . ini_get('memory_limit') . "\n";
          echo "  Upload max filesize: " . ini_get('upload_max_filesize') . "\n";
          
          echo "\n" . str_repeat("=", 50) . "\n";
          echo "Test completed successfully!\n";
          ?>
          EOF
          
          /opt/php8/bin/php /opt/php8/test-compatibility.php
      
      - name: Package PHP Portable
        run: |
          cd /opt
          tar -czf /tmp/php8-portable-rhel7-8-9.tar.gz php8/
          
          ls -lh /tmp/php8-portable-rhel7-8-9.tar.gz
          echo ""
          echo "Build completed on CentOS 7 (compatible with RHEL 7/8/9)"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: php8-portable-rhel7-8-9-${{ inputs.php_version }}
          path: /tmp/php8-portable-rhel7-8-9.tar.gz
          retention-days: 30
      
      - name: Create README
        run: |
          cat > /tmp/README.txt << 'EOF'
          ========================================
          PHP 8 Portable for RHEL 7/8/9
          ========================================
          
          Kompatibilitas:
          ✅ RHEL/CentOS 7
          ✅ RHEL/Rocky/Alma 8
          ✅ RHEL/Rocky/Alma/Oracle 9
          
          Cara Penggunaan:
          
          1. Extract archive:
             tar -xzf php8-portable-rhel7-8-9.tar.gz
          
          2. Test PHP:
             ./php8/run-php.sh -v
          
          3. Test kompatibilitas:
             ./php8/run-php.sh test-compatibility.php
          
          4. Cek ekstensi:
             ./php8/run-php.sh -m
          
          5. Gunakan PHP:
             ./php8/run-php.sh script.php
             ./php8/bin/php script.php
          
          Ekstensi yang sudah include:
          ✅ MySQL/MySQLi/PDO MySQL
          ✅ PostgreSQL/PDO PostgreSQL
          ✅ GD (image processing)
          ✅ cURL
          ✅ JSON (built-in)
          ✅ Base64 functions (built-in)
          ✅ Zip
          ✅ MBString
          ✅ BCMath
          ✅ Sockets
          ✅ EXIF
          ✅ PCNTL
          
          Konfigurasi:
          - php.ini: php8/bin/php.ini
          - Edit sesuai kebutuhan
          
          Untuk Excel (XLS/XLSX):
          Install PhpSpreadsheet via Composer:
          
            cd php8/bin
            wget https://getcomposer.org/installer -O composer-setup.php
            ./php composer-setup.php --install-dir=. --filename=composer
            ./composer require phpoffice/phpspreadsheet
          
          Contoh Script Test:
          
          <?php
          // test.php
          echo "PHP Version: " . phpversion() . "\n";
          echo "JSON Test: " . json_encode(['test' => 'ok']) . "\n";
          echo "Base64 Test: " . base64_encode('hello') . "\n";
          
          // Test MySQL
          if (extension_loaded('mysqli')) {
              echo "MySQL: ✓ Available\n";
          }
          
          // Test PostgreSQL
          if (extension_loaded('pgsql')) {
              echo "PostgreSQL: ✓ Available\n";
          }
          
          // Test GD
          if (extension_loaded('gd')) {
              $info = gd_info();
              echo "GD Version: " . $info['GD Version'] . "\n";
          }
          ?>
          
          Troubleshooting:
          
          1. Jika ada error "libstdc++.so.6: version GLIBCXX not found":
             - Install: yum install libstdc++
          
          2. Jika ada error library lainnya:
             - Jalankan: ldd php8/bin/php
             - Install missing libraries dengan yum/dnf
          
          3. Test di semua RHEL versions:
             # RHEL 7
             ./php8/run-php.sh test-compatibility.php
             
             # RHEL 8
             ./php8/run-php.sh test-compatibility.php
             
             # RHEL 9
             ./php8/run-php.sh test-compatibility.php
          
          Support:
          - Website: https://www.php.net
          - Docs: https://www.php.net/docs.php
          
          Build Info:
          - Built on: CentOS 7
          - Compiler: GCC 11 (DevToolset)
          - Compatible: RHEL 7/8/9
          EOF
          
          cat /tmp/README.txt
      
      - name: Upload README
        uses: actions/upload-artifact@v4
        with:
          name: README
          path: /tmp/README.txt
          retention-days: 30
