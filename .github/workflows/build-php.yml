name: Build PHP 8 Portable - Simplified

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP Version'
        required: true
        default: '8.3.14'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:8
    
    steps:
      - name: Install Build Dependencies
        run: |
          # Enable PowerTools and EPEL
          dnf install -y epel-release
          dnf config-manager --set-enabled powertools
          
          # Install all dependencies including oniguruma and libzip from repo
          dnf install -y gcc gcc-c++ make autoconf automake libtool \
            libxml2-devel openssl-devel sqlite-devel \
            libcurl-devel libpng-devel libjpeg-devel \
            freetype-devel postgresql-devel readline-devel \
            oniguruma-devel libzip-devel \
            wget tar gzip bzip2 pkgconfig cmake bison re2c \
            diffutils file
      
      - name: Download PHP Source
        run: |
          cd /tmp
          wget https://www.php.net/distributions/php-${{ inputs.php_version }}.tar.gz
          tar -xzf php-${{ inputs.php_version }}.tar.gz
      
      - name: Configure PHP
        run: |
          cd /tmp/php-${{ inputs.php_version }}
          
          ./configure \
            --prefix=/opt/php8 \
            --enable-mbstring \
            --enable-bcmath \
            --enable-sockets \
            --enable-exif \
            --enable-gd \
            --with-jpeg \
            --with-freetype \
            --with-curl \
            --with-openssl \
            --with-zlib \
            --with-zip \
            --with-pgsql \
            --with-mysqli \
            --enable-pcntl \
            --disable-cgi \
            --disable-pdo
      
      - name: Compile PHP
        run: |
          cd /tmp/php-${{ inputs.php_version }}
          make -j$(nproc)
      
      - name: Install PHP
        run: |
          cd /tmp/php-${{ inputs.php_version }}
          make install
          
          # Copy shared libraries yang diperlukan
          mkdir -p /opt/php8/lib
          
          # Copy oniguruma
          cp -L /usr/lib64/libonig.so* /opt/php8/lib/ 2>/dev/null || true
          
          # Copy libzip
          cp -L /usr/lib64/libzip.so* /opt/php8/lib/ 2>/dev/null || true
          
          # Check dependencies
          echo "=== PHP Binary Dependencies ==="
          ldd /opt/php8/bin/php
      
      - name: Configure php.ini
        run: |
          cd /tmp/php-${{ inputs.php_version }}
          cp php.ini-production /opt/php8/bin/php.ini
          
          cat >> /opt/php8/bin/php.ini << 'EOF'
          
          ; Custom configuration
          memory_limit = 256M
          upload_max_filesize = 50M
          post_max_size = 50M
          max_execution_time = 300
          max_input_time = 300
          
          display_errors = Off
          error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
          log_errors = On
          
          date.timezone = Asia/Jakarta
          EOF
      
      - name: Create Wrapper Script
        run: |
          cat > /opt/php8/run-php.sh << 'EOF'
          #!/bin/bash
          export PHP_HOME="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$PHP_HOME/lib:$LD_LIBRARY_PATH"
          export PATH="$PHP_HOME/bin:$PATH"
          export PHPRC="$PHP_HOME/bin"
          
          exec "$PHP_HOME/bin/php" "$@"
          EOF
          
          chmod +x /opt/php8/run-php.sh
      
      - name: Create Compatibility Test Script
        run: |
          cat > /opt/php8/test-compatibility.php << 'EOF'
          <?php
          echo "PHP Compatibility Test\n";
          echo str_repeat("=", 60) . "\n\n";
          
          echo "PHP Version: " . phpversion() . "\n";
          echo "Zend Engine: " . zend_version() . "\n";
          echo "System: " . php_uname() . "\n\n";
          
          echo "Core Extensions Status:\n";
          $required = [
              'Core', 'date', 'pcre', 'SPL', 'standard',
              'json', 'mbstring', 'curl', 'gd', 
              'mysqli', 'pgsql', 
              'zip', 'bcmath', 'sockets', 'exif', 'pcntl'
          ];
          
          $loaded = 0;
          $missing = [];
          foreach ($required as $ext) {
              $status = extension_loaded($ext);
              if ($status) {
                  $loaded++;
                  echo "  ✓ $ext\n";
              } else {
                  echo "  ✗ $ext\n";
                  $missing[] = $ext;
              }
          }
          
          echo "\nStatus: $loaded/" . count($required) . " extensions loaded\n";
          
          echo "\nBuilt-in Functions Test:\n";
          $tests = [
              ['base64_encode', 'Base64 Encode', 'test'],
              ['json_encode', 'JSON Encode', ['key' => 'value']],
              ['md5', 'MD5 Hash', 'test'],
              ['sha1', 'SHA1 Hash', 'test'],
          ];
          
          foreach ($tests as list($func, $name, $input)) {
              if (function_exists($func)) {
                  $result = is_array($input) ? $func($input) : $func($input);
                  echo "  ✓ $name: " . substr($result, 0, 20) . "...\n";
              } else {
                  echo "  ✗ $name: Not available\n";
              }
          }
          
          echo "\nPHP Settings:\n";
          $settings = [
              'max_execution_time' => ini_get('max_execution_time') . 's',
              'memory_limit' => ini_get('memory_limit'),
              'upload_max_filesize' => ini_get('upload_max_filesize'),
              'post_max_size' => ini_get('post_max_size'),
              'date.timezone' => ini_get('date.timezone'),
          ];
          
          foreach ($settings as $key => $value) {
              echo "  $key: $value\n";
          }
          
          if (extension_loaded('gd')) {
              echo "\nGD Library Info:\n";
              $gd = gd_info();
              echo "  Version: " . $gd['GD Version'] . "\n";
              echo "  JPEG: " . ($gd['JPEG Support'] ? 'Yes' : 'No') . "\n";
              echo "  PNG: " . ($gd['PNG Support'] ? 'Yes' : 'No') . "\n";
              echo "  FreeType: " . ($gd['FreeType Support'] ? 'Yes' : 'No') . "\n";
          }
          
          if (extension_loaded('mysqli')) {
              echo "\nMySQL Client Info:\n";
              echo "  Version: " . mysqli_get_client_info() . "\n";
          }
          
          if (extension_loaded('pgsql')) {
              echo "\nPostgreSQL Client Info:\n";
              $version = pg_version();
              if (isset($version['client'])) {
                  echo "  Version: " . $version['client'] . "\n";
              }
          }
          
          echo "\n" . str_repeat("=", 60) . "\n";
          
          if (count($missing) === 0) {
              echo "✅ ALL TESTS PASSED!\n";
              echo "✅ PHP is ready to use on RHEL 7/8/9!\n";
              exit(0);
          } else {
              echo "⚠️  Missing extensions: " . implode(', ', $missing) . "\n";
              exit(1);
          }
          ?>
          EOF
      
      - name: Test PHP
        run: |
          export LD_LIBRARY_PATH=/opt/php8/lib:$LD_LIBRARY_PATH
          
          echo "=== PHP Version ==="
          /opt/php8/bin/php -v
          
          echo ""
          echo "=== Installed Extensions (first 40) ==="
          /opt/php8/bin/php -m | head -40
          
          echo ""
          echo "=== Running Compatibility Test ==="
          /opt/php8/bin/php /opt/php8/test-compatibility.php
      
      - name: Package PHP Portable
        run: |
          cd /opt
          tar -czf /tmp/php8-portable-rhel.tar.gz php8/
          
          echo ""
          echo "✅ Package created successfully!"
          ls -lh /tmp/php8-portable-rhel.tar.gz
          echo ""
          echo "Built on: Rocky Linux 8"
          echo "Target: RHEL/CentOS 7, RHEL/Rocky/Alma 8/9"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: php8-portable-rhel-${{ inputs.php_version }}
          path: /tmp/php8-portable-rhel.tar.gz
          retention-days: 30
      
      - name: Create Installation Guide
        run: |
          cat > /tmp/INSTALL.md << 'EOF'
          # PHP 8 Portable - Installation Guide
          
          ## Quick Start
          
          ```bash
          # 1. Extract
          tar -xzf php8-portable-rhel.tar.gz
          
          # 2. Test installation
          ./php8/run-php.sh -v
          
          # 3. Run compatibility test
          ./php8/run-php.sh test-compatibility.php
          
          # 4. Start using PHP
          ./php8/run-php.sh your-script.php
          ```
          
          ## System Compatibility
          
          ✅ RHEL/CentOS 7.x  
          ✅ RHEL/Rocky/Alma 8.x  
          ✅ RHEL/Rocky/Oracle/Alma 9.x  
          
          ## What's Included
          
          ### Database Support
          - MySQL/MariaDB (mysqli - native driver)
          - PostgreSQL (pgsql - native driver)
          
          **Note:** PDO is NOT included. Use mysqli for MySQL and pgsql for PostgreSQL.
          
          ### Image Processing
          - GD Library (JPEG, PNG, FreeType)
          
          ### Data Formats
          - JSON (encoding/decoding)
          - Base64 (encoding/decoding)
          - ZIP (compression/extraction)
          - XML
          
          ### Network
          - cURL (HTTP client)
          - Sockets
          
          ### Utilities
          - MBString (multibyte strings)
          - BCMath (arbitrary precision)
          - EXIF (image metadata)
          - PCNTL (process control)
          
          ## Configuration
          
          Edit `php8/bin/php.ini` to customize:
          
          ```ini
          memory_limit = 256M
          upload_max_filesize = 50M
          post_max_size = 50M
          max_execution_time = 300
          date.timezone = Asia/Jakarta
          ```
          
          ## Installing Composer
          
          ```bash
          cd php8/bin
          wget https://getcomposer.org/installer -O composer-setup.php
          ./php composer-setup.php --install-dir=. --filename=composer
          chmod +x composer
          ```
          
          ## Excel Support (PhpSpreadsheet)
          
          ```bash
          # After installing Composer
          cd php8/bin
          ./composer require phpoffice/phpspreadsheet
          ```
          
          Example usage:
          ```php
          <?php
          require 'php8/bin/vendor/autoload.php';
          
          use PhpOffice\PhpSpreadsheet\Spreadsheet;
          use PhpOffice\PhpSpreadsheet\Writer\Xlsx;
          
          $spreadsheet = new Spreadsheet();
          $sheet = $spreadsheet->getActiveSheet();
          $sheet->setCellValue('A1', 'Hello World!');
          
          $writer = new Xlsx($spreadsheet);
          $writer->save('hello.xlsx');
          ?>
          ```
          
          ## Sample Scripts
          
          ### Database Connection (MySQL)
          
          ```php
          <?php
          // Connect
          $mysqli = new mysqli("localhost", "user", "password", "database");
          
          if ($mysqli->connect_error) {
              die("Connection failed: " . $mysqli->connect_error);
          }
          
          echo "Connected successfully\n";
          
          // Query
          $result = $mysqli->query("SELECT * FROM users LIMIT 10");
          
          if ($result) {
              while ($row = $result->fetch_assoc()) {
                  echo "User: " . $row['username'] . "\n";
              }
              $result->free();
          }
          
          // Prepared Statement
          $stmt = $mysqli->prepare("SELECT name, email FROM users WHERE id = ?");
          $user_id = 1;
          $stmt->bind_param("i", $user_id);
          $stmt->execute();
          $stmt->bind_result($name, $email);
          
          while ($stmt->fetch()) {
              echo "Name: $name, Email: $email\n";
          }
          
          $stmt->close();
          $mysqli->close();
          ?>
          ```
          
          ### Database Connection (PostgreSQL)
          
          ```php
          <?php
          // Connect
          $conn = pg_connect("host=localhost dbname=mydb user=myuser password=mypass");
          
          if (!$conn) {
              die("Connection failed\n");
          }
          
          echo "Connected successfully\n";
          
          // Query
          $result = pg_query($conn, "SELECT * FROM users LIMIT 10");
          
          if ($result) {
              while ($row = pg_fetch_assoc($result)) {
                  echo "User: " . $row['username'] . "\n";
              }
              pg_free_result($result);
          }
          
          // Prepared Statement
          $result = pg_prepare($conn, "get_user", "SELECT name, email FROM users WHERE id = $1");
          $result = pg_execute($conn, "get_user", array(1));
          
          if ($result) {
              $row = pg_fetch_assoc($result);
              echo "Name: " . $row['name'] . ", Email: " . $row['email'] . "\n";
              pg_free_result($result);
          }
          
          pg_close($conn);
          ?>
          ```
          
          ### Image Processing
          
          ```php
          <?php
          $image = imagecreatetruecolor(200, 200);
          $color = imagecolorallocate($image, 255, 0, 0);
          imagefill($image, 0, 0, $color);
          imagepng($image, 'output.png');
          imagedestroy($image);
          echo "Image created!\n";
          ?>
          ```
          
          ### JSON & Base64
          
          ```php
          <?php
          // JSON
          $data = ['name' => 'John', 'age' => 30];
          $json = json_encode($data);
          echo "JSON: $json\n";
          
          // Base64
          $encoded = base64_encode('Hello World');
          echo "Base64: $encoded\n";
          
          $decoded = base64_decode($encoded);
          echo "Decoded: $decoded\n";
          ?>
          ```
          
          ## Troubleshooting
          
          ### Missing library errors
          
          If you see "error while loading shared libraries":
          
          ```bash
          # Check what's missing
          ldd php8/bin/php
          
          # Install missing libraries (RHEL 7/8)
          yum install libstdc++
          
          # Install missing libraries (RHEL 9)
          dnf install libstdc++
          ```
          
          ### Permission issues
          
          ```bash
          chmod +x php8/run-php.sh
          chmod +x php8/bin/php
          ```
          
          ### Path issues
          
          Always use absolute path or:
          ```bash
          export PATH=/path/to/php8/bin:$PATH
          php -v
          ```
          
          ## Performance Tips
          
          1. Enable OPcache in php.ini:
          ```ini
          zend_extension=opcache.so
          opcache.enable=1
          opcache.memory_consumption=128
          opcache.max_accelerated_files=10000
          ```
          
          2. Adjust memory based on workload
          3. Use connection pooling for databases
          4. Enable compression for large responses
          
          ## Support
          
          - PHP Documentation: https://www.php.net/docs.php
          - Report Issues: Your GitHub repository
          
          ---
          
          **Built with Rocky Linux 8 for maximum RHEL compatibility**
          EOF
          
          cat /tmp/INSTALL.md
      
      - name: Upload Installation Guide
        uses: actions/upload-artifact@v4
        with:
          name: INSTALL
          path: /tmp/INSTALL.md
          retention-days: 30
