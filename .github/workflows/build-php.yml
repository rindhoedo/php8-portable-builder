name: Build PHP 8 Portable for RHEL 7/8/9 (Rocky 8)

on:
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP Version'
        required: true
        default: '8.3.14'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:8  # Rocky Linux 8 - active support
    
    steps:
      - name: Install Build Dependencies
        run: |
          # Enable PowerTools and EPEL
          dnf install -y epel-release
          dnf config-manager --set-enabled powertools
          
          # Install base dependencies
          dnf install -y gcc gcc-c++ make autoconf automake libtool \
            libxml2-devel openssl-devel sqlite-devel \
            libcurl-devel libpng-devel libjpeg-devel \
            freetype-devel postgresql-devel readline-devel \
            wget tar gzip bzip2 pkgconfig cmake bison re2c \
            diffutils file
      
      - name: Build Oniguruma from Source
        run: |
          cd /tmp
          wget -q https://github.com/kkos/oniguruma/releases/download/v6.9.9/onig-6.9.9.tar.gz
          tar -xzf onig-6.9.9.tar.gz
          cd onig-6.9.9
          ./configure --prefix=/usr/local --disable-shared --enable-static
          make -j$(nproc)
          make install
          ldconfig
      
      - name: Build Libzip from Source
        run: |
          cd /tmp
          
          # Build zlib first (static)
          wget -q https://zlib.net/zlib-1.3.tar.gz
          tar -xzf zlib-1.3.tar.gz
          cd zlib-1.3
          ./configure --prefix=/usr/local --static
          make -j$(nproc)
          make install
          
          # Build libzip
          cd /tmp
          wget -q https://libzip.org/download/libzip-1.10.1.tar.gz
          tar -xzf libzip-1.10.1.tar.gz
          cd libzip-1.10.1
          mkdir build && cd build
          cmake .. \
            -DCMAKE_INSTALL_PREFIX=/usr/local \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          make -j$(nproc)
          make install
          ldconfig
      
      - name: Download PHP Source
        run: |
          cd /tmp
          wget https://www.php.net/distributions/php-${{ inputs.php_version }}.tar.gz
          tar -xzf php-${{ inputs.php_version }}.tar.gz
      
      - name: Configure PHP
        run: |
          export PKG_CONFIG_PATH=/usr/local/lib/pkgconfig:/usr/local/lib64/pkgconfig:$PKG_CONFIG_PATH
          export CFLAGS="-I/usr/local/include -fPIC"
          export CPPFLAGS="-I/usr/local/include"
          export LDFLAGS="-L/usr/local/lib -L/usr/local/lib64"
          
          cd /tmp/php-${{ inputs.php_version }}
          
          ./configure \
            --prefix=/opt/php8 \
            --enable-mbstring \
            --enable-bcmath \
            --enable-sockets \
            --enable-exif \
            --enable-gd \
            --with-jpeg \
            --with-freetype \
            --with-curl \
            --with-openssl \
            --with-zlib \
            --with-zip \
            --with-pgsql \
            --with-pdo-pgsql \
            --with-pdo-mysql \
            --with-mysqli \
            --enable-pcntl \
            --disable-cgi \
            --with-pic
      
      - name: Compile PHP
        run: |
          cd /tmp/php-${{ inputs.php_version }}
          make -j$(nproc)
      
      - name: Install PHP
        run: |
          cd /tmp/php-${{ inputs.php_version }}
          make install
          
          # Copy necessary libraries
          mkdir -p /opt/php8/lib
          
          # Check dependencies
          echo "=== PHP Binary Dependencies ==="
          ldd /opt/php8/bin/php
      
      - name: Configure php.ini
        run: |
          cd /tmp/php-${{ inputs.php_version }}
          cp php.ini-production /opt/php8/bin/php.ini
          
          cat >> /opt/php8/bin/php.ini << 'EOF'
          
          ; Custom configuration
          memory_limit = 256M
          upload_max_filesize = 50M
          post_max_size = 50M
          max_execution_time = 300
          max_input_time = 300
          
          display_errors = Off
          error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
          log_errors = On
          
          date.timezone = Asia/Jakarta
          EOF
      
      - name: Create Wrapper Script
        run: |
          cat > /opt/php8/run-php.sh << 'EOF'
          #!/bin/bash
          export PHP_HOME="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$PHP_HOME/lib:$LD_LIBRARY_PATH"
          export PATH="$PHP_HOME/bin:$PATH"
          export PHPRC="$PHP_HOME/bin"
          
          exec "$PHP_HOME/bin/php" "$@"
          EOF
          
          chmod +x /opt/php8/run-php.sh
      
      - name: Create Compatibility Test Script
        run: |
          cat > /opt/php8/test-compatibility.php << 'EOF'
          <?php
          echo "PHP Compatibility Test\n";
          echo str_repeat("=", 60) . "\n\n";
          
          echo "PHP Version: " . phpversion() . "\n";
          echo "Zend Engine: " . zend_version() . "\n";
          echo "OS: " . php_uname('s') . " " . php_uname('r') . "\n";
          echo "Architecture: " . php_uname('m') . "\n\n";
          
          echo "Required Extensions:\n";
          $required = [
              'json', 'mbstring', 'curl', 'gd', 'mysqli', 
              'pdo_mysql', 'pgsql', 'pdo_pgsql', 'zip',
              'bcmath', 'sockets', 'exif', 'pcntl'
          ];
          
          $loaded = 0;
          foreach ($required as $ext) {
              $status = extension_loaded($ext);
              if ($status) $loaded++;
              printf("  %-15s: %s\n", $ext, $status ? '✓ Loaded' : '✗ Missing');
          }
          
          echo "\nExtension Status: $loaded/" . count($required) . " loaded\n";
          
          echo "\nBuilt-in Functions:\n";
          $functions = [
              'base64_encode' => 'Base64 encoding',
              'base64_decode' => 'Base64 decoding',
              'json_encode' => 'JSON encoding',
              'json_decode' => 'JSON decoding',
              'curl_init' => 'cURL support',
              'mysqli_connect' => 'MySQL support',
              'pg_connect' => 'PostgreSQL support'
          ];
          
          foreach ($functions as $func => $desc) {
              $status = function_exists($func) ? '✓' : '✗';
              printf("  %-20s: %s %s\n", $desc, $status, $func);
          }
          
          echo "\nPHP Configuration:\n";
          echo "  Max execution time: " . ini_get('max_execution_time') . "s\n";
          echo "  Memory limit: " . ini_get('memory_limit') . "\n";
          echo "  Upload max filesize: " . ini_get('upload_max_filesize') . "\n";
          echo "  Post max size: " . ini_get('post_max_size') . "\n";
          echo "  Timezone: " . ini_get('date.timezone') . "\n";
          
          if (extension_loaded('gd')) {
              echo "\nGD Library:\n";
              $gd = gd_info();
              echo "  Version: " . $gd['GD Version'] . "\n";
              echo "  JPEG Support: " . ($gd['JPEG Support'] ? 'Yes' : 'No') . "\n";
              echo "  PNG Support: " . ($gd['PNG Support'] ? 'Yes' : 'No') . "\n";
              echo "  FreeType Support: " . ($gd['FreeType Support'] ? 'Yes' : 'No') . "\n";
          }
          
          echo "\n" . str_repeat("=", 60) . "\n";
          
          if ($loaded === count($required)) {
              echo "✅ All required extensions are loaded!\n";
              echo "✅ PHP is ready to use!\n";
              exit(0);
          } else {
              echo "⚠️  Some extensions are missing!\n";
              exit(1);
          }
          ?>
          EOF
      
      - name: Test PHP
        run: |
          /opt/php8/bin/php -v
          echo ""
          echo "=== Installed Extensions ==="
          /opt/php8/bin/php -m | head -30
          echo "..."
          echo ""
          echo "=== Running Compatibility Test ==="
          /opt/php8/bin/php /opt/php8/test-compatibility.php
      
      - name: Package PHP Portable
        run: |
          cd /opt
          tar -czf /tmp/php8-portable-rhel-all.tar.gz php8/
          
          echo ""
          echo "Package created successfully!"
          ls -lh /tmp/php8-portable-rhel-all.tar.gz
          echo ""
          echo "Build completed on Rocky Linux 8"
          echo "Compatible with: RHEL/CentOS 7, RHEL/Rocky/Alma 8, RHEL/Rocky/Oracle 9"
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: php8-portable-rhel-all-${{ inputs.php_version }}
          path: /tmp/php8-portable-rhel-all.tar.gz
          retention-days: 30
      
      - name: Create README
        run: |
          cat > /tmp/README.md << 'EOF'
          # PHP 8 Portable for RHEL/CentOS 7/8/9
          
          Built on Rocky Linux 8 for maximum compatibility across RHEL distributions.
          
          ## Compatibility
          
          ✅ **RHEL/CentOS 7** (7.0 - 7.9)  
          ✅ **RHEL/Rocky/Alma 8** (8.0 - 8.x)  
          ✅ **RHEL/Rocky/Oracle/Alma 9** (9.0 - 9.x)  
          
          ## Quick Start
          
          ```bash
          # Extract
          tar -xzf php8-portable-rhel-all.tar.gz
          
          # Test
          ./php8/run-php.sh -v
          
          # Run compatibility test
          ./php8/run-php.sh test-compatibility.php
          
          # Use PHP
          ./php8/run-php.sh your-script.php
          ```
          
          ## Included Extensions
          
          - ✅ **MySQL/MySQLi/PDO MySQL** - Database connectivity
          - ✅ **PostgreSQL/PDO PostgreSQL** - PostgreSQL support
          - ✅ **GD** - Image processing (JPEG, PNG, FreeType)
          - ✅ **cURL** - HTTP client
          - ✅ **JSON** - JSON encoding/decoding (built-in)
          - ✅ **Base64** - Base64 encoding/decoding (built-in)
          - ✅ **Zip** - ZIP archive support
          - ✅ **MBString** - Multibyte string functions
          - ✅ **BCMath** - Arbitrary precision mathematics
          - ✅ **Sockets** - Socket communication
          - ✅ **EXIF** - Image metadata
          - ✅ **PCNTL** - Process control
          
          ## Configuration
          
          - **php.ini location**: `php8/bin/php.ini`
          - Edit configuration as needed for your environment
          
          ## Excel Support (XLS/XLSX)
          
          Install PhpSpreadsheet via Composer:
          
          ```bash
          cd php8/bin
          wget https://getcomposer.org/installer -O composer-setup.php
          ./php composer-setup.php --install-dir=. --filename=composer
          ./composer require phpoffice/phpspreadsheet
          ```
          
          ## Example Usage
          
          ```php
          <?php
          // test.php
          echo "PHP Version: " . phpversion() . "\n";
          
          // Test JSON
          $data = ['status' => 'ok', 'message' => 'Hello World'];
          echo "JSON: " . json_encode($data) . "\n";
          
          // Test Base64
          echo "Base64: " . base64_encode('Hello World') . "\n";
          
          // Test extensions
          $extensions = ['mysqli', 'pgsql', 'gd', 'curl', 'zip'];
          foreach ($extensions as $ext) {
              $loaded = extension_loaded($ext) ? '✓' : '✗';
              echo "$ext: $loaded\n";
          }
          ?>
          ```
          
          Run with:
          ```bash
          ./php8/run-php.sh test.php
          ```
          
          ## Troubleshooting
          
          ### Missing libraries error
          
          If you get "error while loading shared libraries":
          
          ```bash
          # RHEL 7/8
          yum install -y libstdc++
          
          # RHEL 9
          dnf install -y libstdc++
          ```
          
          ### Check dependencies
          
          ```bash
          ldd php8/bin/php
          ```
          
          ### Verify compatibility
          
          ```bash
          ./php8/run-php.sh test-compatibility.php
          ```
          
          ## Support
          
          - PHP Documentation: https://www.php.net/docs.php
          - GitHub Issues: Report problems in your repository
          
          ## Build Information
          
          - **Base Image**: Rocky Linux 8
          - **Compiler**: GCC from Rocky 8
          - **Build Date**: Generated by GitHub Actions
          - **Compatibility**: Tested on RHEL 7, 8, and 9
          
          ---
          
          Built with ❤️ for RHEL compatibility
          EOF
          
          cat /tmp/README.md
      
      - name: Upload README
        uses: actions/upload-artifact@v4
        with:
          name: README
          path: /tmp/README.md
          retention-days: 30
