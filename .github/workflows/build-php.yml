name: Build PHP 8 Portable - Final (Clean)
on:
  workflow_dispatch:
    inputs:
      php_version:
        description: PHP Version
        required: true
        default: '8.3.14'
        type: string
jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: rockylinux:8
    steps:
      - name: Enable repos & install toolchain
        run: |
          set -euo pipefail
          dnf install -y epel-release dnf-plugins-core
          dnf config-manager --set-enabled powertools || dnf config-manager --set-enabled PowerTools || true
          dnf groupinstall -y "Development Tools"
          dnf install -y which autoconf automake libtool bison re2c cmake pkgconfig diffutils file patch wget tar gzip bzip2
          dnf install -y glibc-devel glibc-headers libstdc++-devel
          dnf install -y libxml2-devel openssl-devel sqlite-devel libcurl-devel libpng-devel libjpeg-turbo-devel freetype-devel postgresql-devel readline-devel oniguruma-devel libzip-devel mariadb-connector-c-devel
          ln -sf /usr/bin/gcc /usr/bin/cc
          gcc --version
      - name: Sanity check compiler
        run: |
          set -euo pipefail
          echo 'int main(){return 0;}' > /tmp/test.c
          cc -O2 /tmp/test.c -o /tmp/a.out
          /tmp/a.out
      - name: Download PHP source
        run: |
          set -euo pipefail
          cd /tmp
          wget https://www.php.net/distributions/php-${{ inputs.php_version }}.tar.gz
          tar -xzf php-${{ inputs.php_version }}.tar.gz
      - name: Configure PHP
        env:
          CC: gcc
          CXX: g++
          PKG_CONFIG_PATH: /usr/lib64/pkgconfig:/usr/share/pkgconfig
        run: |
          set -euo pipefail
          cd /tmp/php-${{ inputs.php_version }}
          CFLAGS="-O2 -fPIE" CXXFLAGS="-O2 -fPIE" LDFLAGS="-pie -Wl,-z,now" ./configure \
            --prefix=/opt/php8 \
            --with-libdir=lib64 \
            --enable-mbstring \
            --enable-bcmath \
            --enable-sockets \
            --enable-exif \
            --enable-gd \
            --with-jpeg \
            --with-freetype \
            --with-curl \
            --with-openssl \
            --with-zlib \
            --with-zip \
            --with-pgsql \
            --with-mysqli \
            --enable-pcntl \
            --enable-opcache \
            --disable-cgi \
            --disable-pdo \
            --disable-phpdbg \
            --without-pear
      - name: Build PHP
        run: |
          set -euo pipefail
          cd /tmp/php-${{ inputs.php_version }}
          make -j"$(nproc)"
      - name: Install PHP & bundle libs
        run: |
          set -euo pipefail
          cd /tmp/php-${{ inputs.php_version }}
          make install
          mkdir -p /opt/php8/lib
          cp -L /usr/lib64/libonig.so* /opt/php8/lib/ 2>/dev/null || true
          cp -L /usr/lib64/libzip.so*  /opt/php8/lib/ 2>/dev/null || true
          cp -L /usr/lib64/libpq.so*   /opt/php8/lib/ 2>/dev/null || true
          cp -L /usr/lib64/libmariadb.so* /opt/php8/lib/ 2>/dev/null || true
          ldd /opt/php8/bin/php | head -40
      - name: Configure php.ini
        run: |
          set -euo pipefail
          cp /tmp/php-${{ inputs.php_version }}/php.ini-production /opt/php8/bin/php.ini
          cat >> /opt/php8/bin/php.ini << 'EOF'
          memory_limit = 256M
          upload_max_filesize = 50M
          post_max_size = 50M
          max_execution_time = 300
          max_input_time = 300
          display_errors = Off
          error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
          log_errors = On
          date.timezone = Asia/Jakarta
          EOF
      - name: Create wrapper
        run: |
          set -euo pipefail
          cat > /opt/php8/run-php.sh << 'EOF'
          #!/bin/bash
          set -euo pipefail
          export PHP_HOME="$(dirname "$(readlink -f "$0")")"
          export LD_LIBRARY_PATH="$PHP_HOME/lib:$LD_LIBRARY_PATH"
          export PATH="$PHP_HOME/bin:$PATH"
          export PHPRC="$PHP_HOME/bin"
          exec "$PHP_HOME/bin/php" "$@"
          EOF
          chmod +x /opt/php8/run-php.sh
      - name: Package
        run: |
          set -euo pipefail
          cd /opt
          tar -czf /tmp/php8-portable-rhel.tar.gz php8/
          ls -lh /tmp/php8-portable-rhel.tar.gz
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: php8-portable-rhel-${{ inputs.php_version }}
          path: /tmp/php8-portable-rhel.tar.gz
          retention-days: 30
